provider:
  name: docker

server:
  port: 10000
  base-path: /

storage:
  file:

sessions:
  default-duration: 5m
  expiration-interval: 20s

logging:
  level: info

strategy:
  dynamic:
    show-details-by-default: true
    default-theme: hacker-terminal
    default-refresh-frequency: 5s
    custom-themes-path: /etc/sablier/themes
